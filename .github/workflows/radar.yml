name: 币圈庄家雷达

on:
 schedule:
 - cron: '0 2 * * *'
 - cron: '30 * * * *'
 workflow_dispatch:

jobs:
 run-radar:
 runs-on: ubuntu-latest
 steps:
 - name: 检出代码
 uses: actions/checkout@v4

 - name: 设置 Python
 uses: actions/setup-python@v5
 with:
 python-version: '3.10'

 - name: 安装依赖
 run: pip install requests

 - name: 创建配置
 run: |
 echo "TG_BOT_TOKEN=${{ secrets.TG_BOT_TOKEN }}" > .env.oi
 echo "TG_CHAT_ID=${{ secrets.TG_CHAT_ID }}" >> .env.oi

 - name: 运行脚本
 run: python3 accumulation_radar.py full
