name: 币圈庄家雷达

on:
  schedule:
    - cron: '0 2 * * *'
    - cron: '30 * * * *'
  workflow_dispatch:

jobs:
  run-radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 安装依赖
        run: python -m pip install requests
      - name: 创建配置
        run: python -c "open('.env.oi','w').write('TG_BOT_TOKEN=' + '${{ secrets.TG_BOT_TOKEN }}' + '\nTG_CHAT_ID=' + '${{ secrets.TG_CHAT_ID }}')"
      - name: 运行脚本
        run: python -c "import requests; r = requests.get('https://fapi.binance.com/fapi/v1/exchangeInfo', timeout=15); data = r.json(); print('状态:', r.status_code, '合约数:', len(data.get('symbols', [])) if isinstance(data, dict) else '不是dict')"
